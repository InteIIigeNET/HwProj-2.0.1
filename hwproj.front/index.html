      <p>
        Веб-сервис, который помогает автоматизировать учебный процесс и упростить
        взаимодействие между студентами, преподавателями и экспертами из индустрии.
      </p>
      <h2>Студентам</h2>
      <ul>
        <li>Записывайтесь на курсы и получайте доступ к материалам.</li>
        <li>Следите за дедлайнами по всем курсам.</li>
        <li>Сдавайте задания и получайте оценки и обратную связь преподавателей.</li>
        <li>Отслеживайте свою успеваемость.</li>
      </ul>

      <ul>
        <li>Создавайте курс: материалы, задания, дедлайны и балльная система.</li>
        <li>Приглашайте студентов и экспертов, контролируйте сроки.</li>
        <li>Проверяйте решения и отвечайте на вопросы прямо в сервисе.</li>
        <li>Анализируйте успеваемость студентов.</li>
      </ul>

      <ul>
        <li>Переходите по приглашению преподавателя и сразу приступайте к работе.</li>
